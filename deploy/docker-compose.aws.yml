# [nexus-deploy] Capa para la EC2 de AWS (va encima de docker-compose.yml y docker-compose.gpu.yml).
# - El backend no se compila en la EC2: se baja de ECR con el tag que fija BACKEND_IMAGE (.env).
# - Los modelos se quedan fijos en la VRAM (-1): una carga fria de Mistral (~10 s) rompe RNF-12.
#
# Uso (lo hace aws/bootstrap.sh):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.aws.yml up -d
services:
  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?Falta BACKEND_IMAGE en .env}
    pull_policy: missing

  ollama:
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
