# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nexus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# ── credenciales ───────────────────────────────────────────────────────────
# Las cinco claves con secreto salieron de este fichero el 2026-09-05 y ahora
# llegan por variable de entorno, que Spring resuelve POR ENCIMA de este
# fichero. Se declaran en ../../../../.env (junto al Makefile) y su plantilla
# versionada es .env.example.
#
#   spring.datasource.username  ->  SPRING_DATASOURCE_USERNAME
#   spring.datasource.password  ->  SPRING_DATASOURCE_PASSWORD
#   jwt.secret                  ->  JWT_SECRET
#   aes.secret                  ->  AES_SECRET
#   spring.mail.username        ->  SPRING_MAIL_USERNAME
#   spring.mail.password        ->  SPRING_MAIL_PASSWORD
#
# Sacarlas de aqui NO las retira del historial de git: las cadenas siguen en
# los commits anteriores a este. Pero el 2026-09-07 se ROTARON las tres
# (jwt.secret, la credencial de MySQL y la contrasena de aplicacion de Gmail),
# asi que lo que queda en el historial ya no autentica contra nada.
# Purgar el historial (git filter-repo / BFG) es una decision aparte, aun
# abierta: reescribe los SHA y obliga a reclonar. Ver nexus-SEC-01.
# ───────────────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# OSIV re-enabled to avoid widespread LazyInitializationException
# Using @Transactional(propagation = REQUIRES_NEW) for specific operations instead
spring.jpa.open-in-view=true

# Logging
logging.level.root=INFO
logging.level.com.nexus=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# JWT Configuration
# jwt.secret NO se declara aqui a proposito: llega solo por la variable de
# entorno JWT_SECRET (ver el mapeo de la linea 16). Sin ella el contexto no
# arranca -- es el comportamiento buscado, no un fallo.
jwt.expiration=86400000
jwt.issuer=nexus-api
# jwt.refresh-expiration queda declarada y SIN CONSUMIR: no hay refresh token.
jwt.refresh-expiration=604800000

# AES Configuration (RNF-11: cifrado de registro emocional / satisfaccion en reposo)
# aes.secret NO se declara aqui a proposito: llega solo por la variable de
# entorno AES_SECRET (ver el mapeo de arriba). Sin ella el contexto no
# arranca -- mismo criterio que jwt.secret.

# Email Configuration (configurar según tu proveedor)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Configuration
app.name=Nexus
app.version=1.0.0
app.frontend-url=http://localhost:8081
app.logo.url=cid:app-logo

# CORS - origenes de navegador autorizados, separados por comas.
# Sobrescribible por entorno con APP_CORS_ALLOWED_ORIGINS (mismo mecanismo que las
# credenciales documentado arriba). Vacio = ningun navegador autorizado.
# Los clientes nativos (Expo Go, APK) no envian Origin y no dependen de esta lista.
# No admite comodines: CorsProperties rompe el arranque si encuentra un '*'.
app.cors.allowed-origins=http://localhost:8081

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
