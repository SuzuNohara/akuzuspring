# Perfil de test. Lo activa @ActiveProfiles("test").
# La conexion real la aporta el contenedor de MySqlSchemaSupport via @ServiceConnection, que tiene
# precedencia sobre estas tres claves. Estan aqui solo para que ningun ${...} quede sin resolver.
spring.datasource.url=jdbc:mysql://localhost:1/nexus
spring.datasource.username=inerte
spring.datasource.password=inerte
spring.jpa.hibernate.ddl-auto=none
spring.main.banner-mode=off
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.com.nexus=INFO
logging.level.org.hibernate.SQL=WARN
