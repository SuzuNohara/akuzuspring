# Perfil de test. Lo activa @ActiveProfiles("test").
# La conexion real la aporta el contenedor de MySqlSchemaSupport via @ServiceConnection, que tiene
# precedencia sobre estas tres claves. Estan aqui solo para que ningun ${...} quede sin resolver.
spring.datasource.url=jdbc:mysql://localhost:1/nexus
spring.datasource.username=inerte
spring.datasource.password=inerte
spring.jpa.hibernate.ddl-auto=none
spring.main.banner-mode=off
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.com.nexus=INFO
logging.level.org.hibernate.SQL=WARN
# nexus-EMO-01: clave de datos de 32 bytes TODO CEROS (base64), solo para tests. FieldCipher avisa
# por log de que es de desarrollo. En runtime llega por la variable NEXUS_CRYPTO_DATA_KEY.
nexus.crypto.data-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
